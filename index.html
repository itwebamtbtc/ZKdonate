<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慈光圖書館線上捐款</title>
  <meta name="description" content="慈光圖書館線上捐款表單，支援藍新金流付款。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">慈光圖書館線上捐款</h1>
    <p class="subtitle">感謝您的支持，讓閱讀與陪伴持續發生。</p>

    <form id="donationForm" class="donation-form">
      <label for="amt">捐款金額（新台幣）<span class="required">*</span></label>
      <input type="number" id="amt" name="amt" min="1" step="1" placeholder="請輸入捐款金額" required />

      <label for="category">捐款用途 <span class="required">*</span></label>
      <select id="category" name="category" required>
        <option value="" disabled selected>請選擇捐款用途</option>
        <option value="圖書館營運支持">圖書館營運支持</option>
        <option value="購書與閱讀推廣">購書與閱讀推廣</option>
        <option value="公益活動支持">公益活動支持</option>
        <option value="不指定用途">不指定用途</option>
      </select>

      <label for="email">電子信箱 <span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required />

      <label for="phone">聯絡電話 <span class="required">*</span></label>
      <input type="tel" id="phone" name="phone" placeholder="例：0912-345-678" autocomplete="tel" required />

      <label for="message">備註</label>
      <textarea id="message" name="message" rows="3" placeholder="可留下收據、聯絡或祝福備註"></textarea>

      <button type="submit" id="payBtn" class="submit-btn">前往付款</button>
      <p id="loadingMsg" class="loading-msg" hidden>正在建立付款資料，請稍候...</p>
    </form>

    <p class="notice">付款將導向藍新金流安全付款頁面。您的付款資料不會儲存在本頁面。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
