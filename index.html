<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慈光圖書館線上捐款</title>
  <meta name="description" content="慈光圖書館線上捐款表單，支援藍新金流付款。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container">
    <h1 class="title">慈光圖書館線上捐款</h1>
    <p class="subtitle">慈光圖書館暨台中淨宗學會，感謝您的護持。</p>

    <form id="donationForm" class="donation-form">
      <label for="amt">捐款金額（新台幣）<span class="required">*</span></label>
      <input type="number" id="amt" name="amt" min="1" step="1" placeholder="請輸入捐款金額" required />

      <label for="category">捐款用途 <span class="required">*</span></label>
      <select id="category" name="category" required>
        <option value="" disabled selected>請選擇捐款用途</option>
        <option value="一般經費">一般經費/不指定用途</option>
        <option value="助印弘法">助印弘法媒體傳播</option>
        <option value="護生助念">護放生聯誼關懷助念</option>
        <option value="慈善救濟">義診施藥慈善救濟</option>
        <option value="建築設備">建築修繕及設備</option>
        <option value="供養三寶">供住持佛寶、法寶、僧寶</option>
      </select>

      <label for="email">電子信箱 <span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required />

      <label for="phone">聯絡電話 <span class="required">*</span></label>
      <input type="tel" id="phone" name="phone" placeholder="例：0912-345678" autocomplete="tel" required />

      <fieldset class="receipt-fieldset">
        <legend>收據寄送</legend>
        <label class="radio-option">
          <input type="radio" name="receiptOption" value="none" checked />
          <span>僅開立收據，無須寄送</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="receiptOption" value="mail" />
          <span>索取紙本收據</span>
        </label>
      </fieldset>

      <div id="receiptFields" class="receipt-fields" hidden>
        <label for="receiptTitle">收據抬頭 <span class="required">*</span></label>
        <input type="text" id="receiptTitle" name="receiptTitle" placeholder="請輸入收據抬頭" />

        <label for="receiptAddress">收件地址 <span class="required">*</span></label>
        <textarea id="receiptAddress" name="receiptAddress" rows="2" placeholder="請輸入收件地址"></textarea>
      </div>

      <label for="message">備註</label>
      <textarea id="message" name="message" rows="3" placeholder="可留下更多資訊(如:回向陽上或往生者...)"></textarea>

      <button type="submit" id="payBtn" class="submit-btn">前往付款</button>
      <p id="loadingMsg" class="loading-msg" hidden>正在建立付款資料，請稍候...</p>
    </form>

    <p class="notice">付款將導向藍新金流安全付款頁面。您的付款資料不會儲存在本頁面。</p>
  </main>

  <script src="app.js"></script>
</body>

</html>
